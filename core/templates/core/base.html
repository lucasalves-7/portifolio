{% load static %}
<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site_name }} | Estágio em TI e Dados{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}{{ site_description }}{% endblock %}">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{% block canonical_url %}{{ request.build_absolute_uri }}{% endblock %}">
    <link rel="icon" href="{% static 'core/img/logo.png' %}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site_name }}">
    <meta property="og:title" content="{% block og_title %}{{ site_name }} | Estágio em TI e Dados{% endblock %}">
    <meta property="og:description" content="{% block og_description %}{{ site_description }}{% endblock %}">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    <meta property="og:image" content="{{ site_url }}{% static 'core/img/logo.png' %}">
    <meta name="twitter:card" content="summary">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        abyss: "#030712",
                        panel: "#07111f",
                        neon: {
                            blue: "#38bdf8",
                            purple: "#8b5cf6",
                            cyan: "#22d3ee",
                            green: "#34d399",
                            pink: "#fb7185"
                        }
                    },
                    fontFamily: {
                        sans: ["Segoe UI", "system-ui", "sans-serif"]
                    },
                    boxShadow: {
                        neon: "0 0 0 1px rgba(56,189,248,.18), 0 0 24px rgba(56,189,248,.14), 0 0 64px rgba(139,92,246,.12)",
                        "neon-strong": "0 0 0 1px rgba(56,189,248,.25), 0 0 32px rgba(56,189,248,.22), 0 0 80px rgba(139,92,246,.2)",
                        terminal: "0 24px 90px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08)"
                    },
                    backgroundImage: {
                        grid: "linear-gradient(rgba(148,163,184,.075) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,.075) 1px, transparent 1px)",
                        circuit: "linear-gradient(90deg, rgba(34,211,238,.12), transparent 16%, transparent 84%, rgba(139,92,246,.1)), repeating-linear-gradient(0deg, transparent 0 31px, rgba(34,211,238,.06) 32px), repeating-linear-gradient(90deg, transparent 0 31px, rgba(148,163,184,.045) 32px)"
                    },
                    animation: {
                        scan: "scan 8s linear infinite",
                        pulseGlow: "pulseGlow 3.5s ease-in-out infinite",
                        floatPanel: "floatPanel 7s ease-in-out infinite"
                    },
                    keyframes: {
                        scan: {
                            "0%": { transform: "translateY(-100%)" },
                            "100%": { transform: "translateY(100%)" }
                        },
                        pulseGlow: {
                            "0%, 100%": { opacity: ".55" },
                            "50%": { opacity: "1" }
                        },
                        floatPanel: {
                            "0%, 100%": { transform: "translateY(0)" },
                            "50%": { transform: "translateY(-10px)" }
                        }
                    }
                }
            }
        };
    </script>

    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        html,
        body {
            max-width: 100%;
            overflow-x: hidden;
        }

        img,
        video,
        iframe {
            max-width: 100%;
        }

        p,
        h1,
        h2,
        h3,
        h4,
        a,
        span {
            overflow-wrap: anywhere;
        }

        a,
        button {
            touch-action: manipulation;
        }

        @media (max-width: 640px) {
            [class*="tracking-[0.35em]"],
            [class*="tracking-[0.28em]"],
            [class*="tracking-[0.25em]"],
            [class*="tracking-[0.22em]"],
            [class*="tracking-[0.2em]"] {
                letter-spacing: .14em !important;
            }

            [data-aos] {
                transform: none !important;
            }
        }
    </style>
</head>

<body class="min-h-screen overflow-x-hidden bg-abyss text-slate-100 antialiased">
    <div class="fixed inset-0 -z-30 bg-[#030712]"></div>
    <div class="fixed inset-0 -z-20 bg-circuit bg-[size:100%_100%,32px_32px,32px_32px] opacity-70"></div>
    <div class="fixed inset-0 -z-10 bg-[linear-gradient(180deg,rgba(3,7,18,.2),rgba(3,7,18,.86)_58%,#030712),linear-gradient(90deg,rgba(34,211,238,.08),transparent_28%,rgba(52,211,153,.06)_52%,transparent_72%,rgba(251,113,133,.06))]"></div>
    <div class="pointer-events-none fixed inset-x-0 top-0 -z-10 h-1/2 animate-scan bg-[linear-gradient(180deg,transparent,rgba(34,211,238,.08),transparent)]"></div>
    <div class="pointer-events-none fixed inset-0 z-[60] bg-[repeating-linear-gradient(180deg,rgba(255,255,255,.025)_0,rgba(255,255,255,.025)_1px,transparent_1px,transparent_4px)] opacity-[.13]"></div>

    {% block content %}{% endblock %}

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            once: true,
            offset: 80,
            easing: "ease-out-cubic"
        });

        feather.replace();

        const btn = document.getElementById("menu-btn");
        const menu = document.getElementById("mobile-menu");
        const iconOpen = document.getElementById("menu-open-icon");
        const iconClose = document.getElementById("menu-close-icon");
        const mobileLinks = document.querySelectorAll("[data-mobile-link]");

        if (btn && menu) {
            btn.addEventListener("click", () => {
                const isHidden = menu.classList.contains("hidden");
                menu.classList.toggle("hidden");
                btn.setAttribute("aria-expanded", String(isHidden));

                if (iconOpen && iconClose) {
                    iconOpen.classList.toggle("hidden", !isHidden);
                    iconClose.classList.toggle("hidden", isHidden);
                }
            });

            mobileLinks.forEach((link) => {
                link.addEventListener("click", () => {
                    menu.classList.add("hidden");
                    btn.setAttribute("aria-expanded", "false");
                    if (iconOpen && iconClose) {
                        iconOpen.classList.remove("hidden");
                        iconClose.classList.add("hidden");
                    }
                });
            });
        }
    </script>
</body>
</html>
